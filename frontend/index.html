function ComposeMail({ user, mailbox, onSent, onCancel }) {
  const [to, setTo] = useState("");
  const [subject, setSubject] = useState("");
  const [body, setBody] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");

  async function send(e) {
    e.preventDefault();
    setError(""); setSending(true);
    const res = await api("/mail/send", {
      method: "POST", headers: { Authorization: `Bearer ${user.token}` },
      body: JSON.stringify({ action: "send", to, subject, body: body.replace(/\n/g, "<br>") }),
    });
    setSending(false);
    if (res.ok) onSent();
    else setError(res.error || "Could not send your message.");
  }

  return (
    <form onSubmit={send} className="p-6 space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-extrabold text-slate-900">New message</h2>
        <button type="button" onClick={onCancel} className="text-sm font-bold text-slate-500 hover:text-slate-700">Cancel</button>
      </div>
      <TextField label="To" value={to} onChange={(e) => setTo(e.target.value)} placeholder="someone@example.com, another@example.com" required />
      <TextField label="Subject" value={subject} onChange={(e) => setSubject(e.target.value)} />
      <TextArea label="Message" rows={10} value={body} onChange={(e) => setBody(e.target.value)} />
      {error && <div className="text-sm font-semibold text-red-600">{error}</div>}
      <div className="flex items-center gap-2">
        <Button type="submit" variant="primary" disabled={sending}>{sending ? "Sending…" : "Send"}</Button>
      </div>
    </form>
  );
}

function Profile({ user, onSaved, setView }) {
  const [displayName, setDisplayName] = useState(user.displayName || "");
  const [email, setEmail] = useState(user.email || "");
  const [bio, setBio] = useState(user.bio || "");
  const [phone, setPhone] = useState(user.phone || "");
  const [avatar, setAvatar] = useState(user.avatar || "");
  const [avatarFile, setAvatarFile] = useState(null);
  const [loading, setLoading] = useState(false);
  const [passwordLoading, setPasswordLoading] = useState(false);
  const [message, setMessage] = useState("");
  const [passwordMessage, setPasswordMessage] = useState("");
  const [error, setError] = useState("");
  const [passwordError, setPasswordError] = useState("");
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");

  const canChangeName = (() => {
    if (!user.nameChangedAt) return true;
    const days = (Date.now() - new Date(user.nameChangedAt).getTime()) / 86400000;
    return days >= 60;
  })();

  async function changePassword(e) {
    e.preventDefault();
    setPasswordError(""); setPasswordMessage(""); setPasswordLoading(true);
    const res = await api("/auth/change-password", {
      method: "POST",
      body: JSON.stringify({
        token: user.token,
        currentPassword,
        newPassword,
        confirmPassword
      })
    });
    setPasswordLoading(false);
    if (res.ok) {
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
      setPasswordMessage("Password changed successfully.");
    } else if (res.error && res.error.includes("session has expired")) {
      setPasswordError(res.error);
      setView("auth");
    } else {
      setPasswordError(res.error || "Could not change your password.");
    }
  }

  async function save(e) {
    e.preventDefault();
    setError(""); setMessage(""); setLoading(true);
    let finalAvatar = avatar;
    if (avatarFile) {
      try { finalAvatar = await resizeImageFile(avatarFile, 512, 0.82); }
      catch (err) { setLoading(false); setError("Could not process that image. Please choose a JPG, PNG, or WebP image."); return; }
    }
    const payload = { token: user.token, email, bio, phone, avatar: finalAvatar };
    if (displayName.trim() !== (user.displayName || "")) payload.displayName = displayName.trim();
    const res = await api("/auth/profile", { method: "PUT", body: JSON.stringify(payload) });
    setLoading(false);
    if (res.ok) {
      setAvatar(res.user.avatar || "");
      setAvatarFile(null);
      onSaved(res.user);
      setMessage(res.user.emailVerified ? "Profile updated successfully." : "Profile updated. Please verify your new email address.");
    } else setError(res.error || "Could not update your profile.");
  }

  return (
    <div className="max-w-2xl mx-auto px-5 py-12">
      <div className="mb-7">
        <h1 className="text-2xl font-extrabold text-slate-900">Your profile</h1>
        <p className="text-sm text-slate-500 mt-1">Update your personal information and profile details.</p>
      </div>
      <form onSubmit={save} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-5">
        <div className="flex items-center gap-4">
          {avatar ? <img src={avatar} alt="" className="w-16 h-16 rounded-full object-cover border border-slate-200" /> :
            <div className="w-16 h-16 rounded-full bg-violet-100 text-violet-700 flex items-center justify-center text-xl font-extrabold">{(displayName || "?")[0].toUpperCase()}</div>}
          <div>
            <label className="inline-flex items-center gap-2 rounded-xl border-2 border-violet-200 text-violet-700 px-4 py-2.5 text-sm font-bold cursor-pointer hover:bg-violet-50">
              <Icon path={ICONS.upload} size={16} /> Upload from computer
              <input type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; if (f) setAvatarFile(f); }} />
            </label>
            <div className="text-xs text-slate-400 mt-2">JPG, PNG, or WebP. The image is resized before upload.</div>
            {avatarFile && <div className="text-xs font-semibold text-violet-600 mt-1">Selected: {avatarFile.name}</div>}
          </div>
        </div>
        <TextField label="Name" value={displayName} onChange={(e) => setDisplayName(e.target.value)} disabled={!canChangeName}
          hint={canChangeName ? "You can change your name now. After changing it, the next change is available in 60 days." : "Name changes are locked until 60 days after your last change."} />
        <TextField label="Email" type="email" required value={email} onChange={(e) => setEmail(e.target.value)} hint={user.emailVerified ? "Verified email address." : "Email verification required."} />
        <TextField label="Phone" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+95 ..." />
        <TextArea label="Bio" rows={4} value={bio} onChange={(e) => setBio(e.target.value)} placeholder="Tell people a little about yourself." />
        <TextField label="Profile image URL" value={avatar} onChange={(e) => setAvatar(e.target.value)} placeholder="https://..." />
        <div className="rounded-xl bg-slate-50 border border-slate-200 p-4 text-sm">
          <span className="font-bold">Username:</span> {user.username}
          <span className="text-slate-400 ml-2">(username cannot be changed here)</span>
        </div>
        {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
        {message && <p className="text-sm text-emerald-600 font-semibold">{message}</p>}

        <div className="border-t border-slate-200 pt-5">
          <h2 className="font-bold text-slate-900 mb-1">Change password</h2>
          <p className="text-xs text-slate-500 mb-4">If the creator gave you a temporary password, enter it as your current password and choose your own password.</p>
          <div className="space-y-4">
            <TextField label="Current password" type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} autoComplete="current-password" />
            <TextField label="New password" type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} hint="At least 6 characters" autoComplete="new-password" />
            <TextField label="Confirm new password" type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} autoComplete="new-password" />
            {passwordError && <p className="text-sm text-red-600 font-semibold">{passwordError}</p>}
            {passwordMessage && <p className="text-sm text-emerald-600 font-semibold">{passwordMessage}</p>}
            <Button type="button" variant="outline" onClick={changePassword}
              disabled={passwordLoading || !currentPassword || !newPassword || !confirmPassword}>
              {passwordLoading ? "Changing…" : "Change password"}
            </Button>
          </div>
        </div>

        <div className="flex gap-3">
          <Button type="submit" className="flex-1" disabled={loading}>{loading ? "Saving…" : "Save changes"}</Button>
          <Button type="button" variant="ghost" onClick={() => setView("browse")}>Cancel</Button>
        </div>
      </form>
    </div>
  );
}

function AdminLogin({ isAdmin, onLogin, onLogout }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    const res = await api("/auth/admin", { method: "POST", body: JSON.stringify({ username, password }) });
    setLoading(false);
    if (res.ok) onLogin({ username: res.username, role: res.role, password, canDelete: res.canDelete, canViewApplications: res.canViewApplications });
    else setError(res.error || "Incorrect username or password.");
  }

  if (isAdmin) {
    return (
      <div className="max-w-sm mx-auto px-5 py-16 text-center">
        <TSOMark size={40} />
        <h2 className="text-xl font-bold mt-4 mb-2">You're signed in as creator</h2>
        <p className="text-slate-500 text-sm mb-6">{isAdmin && "You can add and edit posts."} {isAdmin && "Only the main creator can delete posts or view job applications."}</p>
        <Button variant="ghost" onClick={onLogout}>Sign out of creator account</Button>
      </div>
    );
  }

  return (
    <div className="max-w-sm mx-auto px-5 py-14">
      <div className="text-center mb-7">
        <div className="inline-flex"><TSOMark size={40} /></div>
        <h1 className="text-xl font-extrabold text-slate-900 mt-3">Creator login</h1>
        <p className="text-slate-500 text-sm mt-1">Sign in to manage job posts on Talentshowoff.</p>
      </div>
      <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        <form onSubmit={submit} className="space-y-4">
          <TextField label="Username" required value={username} onChange={(e) => setUsername(e.target.value)} autoCapitalize="none" autoCorrect="off" />
          <TextField label="Password" type="password" required value={password} onChange={(e) => setPassword(e.target.value)} />
          {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
          <Button type="submit" className="w-full" disabled={loading}>{loading ? "Checking…" : "Sign in"}</Button>
        </form>
      </div>
    </div>
  );
}



function JobModeration({ adminUsername, adminPassword, onNotify, onJobsChanged }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState("");
  const auth = () => ({ adminUsername, adminPassword });

  async function load() {
    setLoading(true);
    const res = await api("/admin/job-submissions?" + new URLSearchParams(auth()).toString());
    setLoading(false);
    if (res.ok) setItems(res.jobs || []);
    else onNotify(res.error || "Could not load moderation queue.");
  }
  useEffect(() => { load(); }, []);

  async function moderate(job, action) {
    setBusy(job.id + action);
    const reason = action === "reject" ? (window.prompt("Reason for rejection (optional):", "Potential scam, misleading or unsafe job post.") || "Rejected during scam/safety review.") : "";
    if (action === "reject" && reason === null) { setBusy(""); return; }
    const res = await api(`/admin/job-submissions/${encodeURIComponent(job.id)}/${action}`, {
      method: "POST", body: JSON.stringify({ ...auth(), reason })
    });
    setBusy("");
    if (!res.ok) return onNotify(res.error || "Moderation action failed.");
    setItems(prev => prev.filter(x => x.id !== job.id));
    onNotify(res.message || (action === "approve" ? "Post approved." : "Post rejected."));
    await onJobsChanged();
  }

  return (
    <div className="max-w-6xl mx-auto px-5 py-10">
      <div className="mb-7">
        <div className="flex items-center gap-2 text-violet-600 text-xs font-bold uppercase tracking-widest mb-2"><Icon path="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" size={14}/> Trust & Safety</div>
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div><h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Post moderation</h1><p className="text-slate-500 text-sm mt-1">Review registered-user job posts before they become public. Reject scam, misleading, suspicious, or unsafe listings.</p></div>
          <Button variant="ghost" onClick={load}>↻ Refresh</Button>
        </div>
      </div>
      <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4 mb-5 text-sm text-amber-900"><strong>Safety workflow:</strong> user post → pending review → approved and published OR rejected and hidden. A rejected user submission automatically refunds the 2 TSO coin fee once.</div>
      {loading ? <div className="bg-white rounded-2xl border p-8 text-center text-slate-400">Loading moderation queue…</div> :
       items.length === 0 ? <div className="bg-white rounded-2xl border border-dashed p-12 text-center"><div className="text-4xl mb-3">🛡️</div><p className="font-extrabold text-slate-800">Queue clear</p><p className="text-sm text-slate-500 mt-1">No pending or rejected submissions need attention.</p></div> :
       <div className="space-y-4">{items.map(job => (
         <article key={job.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
           <div className="p-5 sm:p-6">
             <div className="flex flex-wrap items-start justify-between gap-3">
               <div><div className="flex items-center gap-2 mb-2"><Badge tone={job.approvalStatus === "pending" ? "amber" : "slate"}>{job.approvalStatus}</Badge><span className="text-xs text-slate-400">Submitted {job.submittedAt ? new Date(job.submittedAt).toLocaleString() : new Date(job.postedAt).toLocaleString()}</span></div>
                 <h2 className="text-lg font-extrabold text-slate-900">{job.title || "Image job announcement"}</h2>
                 <p className="text-sm text-slate-500 mt-1">{job.company || "—"} · {job.location || "—"} · {job.type || "—"}</p>
                 <p className="text-xs text-slate-400 mt-1">Submitted by @{job.employerUsername || "unknown"}</p>
               </div>
               <div className="flex gap-2"><Button onClick={() => moderate(job, "approve")} disabled={busy}>{busy === job.id+"approve" ? "Approving…" : "✓ Approve & publish"}</Button><Button variant="danger" onClick={() => moderate(job, "reject")} disabled={busy}>{busy === job.id+"reject" ? "Rejecting…" : "✕ Reject"}</Button></div>
             </div>
             {job.imageData ? <img src={job.imageData} alt="Submitted job flyer" className="mt-5 max-h-[420px] w-full object-contain rounded-xl border border-slate-200 bg-slate-50"/> :
               <div className="mt-5 rounded-xl bg-slate-50 border border-slate-200 p-4 space-y-2 text-sm"><p><strong>Category:</strong> {job.category || "—"}</p><p><strong>Pay:</strong> {job.pay || "Not stated"}</p><p className="whitespace-pre-line"><strong>Description:</strong>{"\n"}{job.description || "—"}</p></div>}
             {job.rejectionReason && <div className="mt-4 rounded-xl bg-red-50 border border-red-100 p-3 text-sm text-red-700"><strong>Previous rejection:</strong> {job.rejectionReason}</div>}
           </div>
         </article>
       ))}</div>}
    </div>
  );
}

function CreatorCoinManagement({ adminUsername, adminPassword }) {
  const [users, setUsers] = useState([]);
  const [selectedUsername, setSelectedUsername] = useState("");
  const [amount, setAmount] = useState("10");
  const [reason, setReason] = useState("Creator coin reward");
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState("");
  const auth = () => ({ adminUsername, adminPassword });

  async function load() {
    setLoading(true);
    const res = await api("/creator/users/coins?" + new URLSearchParams(auth()).toString());
    setLoading(false);
    if (res.ok) {
      setUsers(res.users || []);
      if (!selectedUsername && res.users?.length) setSelectedUsername(res.users[0].username);
      setMessage("");
    } else setMessage(res.error || "Could not load users.");
  }
  useEffect(() => { load(); }, []);

  async function addCoins(e) {
    e.preventDefault();
    setBusy(true); setMessage("");
    const res = await api("/creator/users/add-coins", {
      method: "POST",
      body: JSON.stringify({ ...auth(), username: selectedUsername, amount: Number(amount), reason })
    });
    setBusy(false);
    if (!res.ok) return setMessage(res.error || "Could not add TSO coins.");
    setMessage(`${res.displayName || res.username} received +${res.addedCoins} TSO coins. New balance: ${res.tsoCoins} TSO coins.`);
    setUsers(prev => prev.map(u => u.username.toLowerCase() === res.username.toLowerCase() ? { ...u, tsoCoins: res.tsoCoins } : u));
  }

  return (
    <div className="max-w-5xl mx-auto px-5 py-10 space-y-6">
      <div>
        <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900">Give TSO Coins</h1>
        <p className="text-sm text-slate-500 mt-1">Creators can reward users with additional TSO coins. Every grant is recorded in the user's coin history.</p>
      </div>

      <div className="bg-white rounded-2xl border border-violet-200 p-6 shadow-sm">
        <form onSubmit={addCoins} className="grid md:grid-cols-[1fr_160px_1fr_auto] gap-4 items-end">
          <div>
            <label className="block text-sm font-bold text-slate-700 mb-1.5">User</label>
            <select value={selectedUsername} onChange={e=>setSelectedUsername(e.target.value)} disabled={loading || !users.length} className="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm font-semibold outline-none focus:border-violet-400 bg-white">
              {users.length === 0 ? <option value="">No users found</option> : users.map(u => <option key={u.username} value={u.username}>{u.displayName || u.username} — {u.tsoCoins ?? 0} TSO</option>)}
            </select>
          </div>
          <TextField label="Coins to add" type="number" min="1" max="100000" value={amount} onChange={e=>setAmount(e.target.value)} required />
          <TextField label="Reason (optional)" value={reason} onChange={e=>setReason(e.target.value)} />
          <Button type="submit" disabled={busy || loading || !selectedUsername}>{busy ? "Adding…" : "+ Add coins"}</Button>
        </form>
        {message && <p className="mt-4 text-sm font-semibold text-violet-700 bg-violet-50 rounded-xl p-3">{message}</p>}
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
          <div><h2 className="font-bold text-slate-900">User TSO balances</h2><p className="text-xs text-slate-500 mt-1">Select a user above to reward them.</p></div>
          <button onClick={load} className="text-sm font-bold text-violet-600">Refresh</button>
        </div>
        {loading ? <p className="p-5 text-sm text-slate-400">Loading users…</p> : users.length === 0 ? <p className="p-5 text-sm text-slate-500">No registered users yet.</p> : (
          <div className="divide-y divide-slate-100 max-h-[520px] overflow-y-auto">
            {users.map(u => <button type="button" key={u.username} onClick={()=>setSelectedUsername(u.username)} className={`w-full px-5 py-4 flex items-center justify-between text-left hover:bg-violet-50 ${selectedUsername === u.username ? "bg-violet-50" : ""}`}><div><div className="font-bold text-slate-900">{u.displayName || u.username}</div><div className="text-xs text-slate-500">@{u.username}</div></div><span className="font-extrabold text-violet-700">{u.tsoCoins ?? 0} TSO</span></button>)}

function CreatorUserManagement({ adminUsername, adminPassword, onPasswordNotice }) {
  const [users, setUsers] = useState([]);
  const [creators, setCreators] = useState([]);
  const [displayName, setDisplayName] = useState("");
  const [username, setUsername] = useState("");
  const [email, setEmail] = useState("");
  const [creatorName, setCreatorName] = useState("");
  const [creatorUsername, setCreatorUsername] = useState("");
  const [creatorEmail, setCreatorEmail] = useState("");
  const [busy, setBusy] = useState(false);
  const [creatorBusy, setCreatorBusy] = useState(false);
  const [message, setMessage] = useState("");
  const [mailboxes, setMailboxes] = useState([]);
  const [mailboxDomain, setMailboxDomain] = useState("talentshowoff.com");
  const [mailboxConfigured, setMailboxConfigured] = useState(true);

  const auth = () => ({ adminUsername, adminPassword });

  async function load() {
    const q = new URLSearchParams(auth()).toString();
    const [userRes, creatorRes, mailboxRes] = await Promise.all([
      api("/admin/users?" + q),
      api("/admin/creators?" + q),
      api("/admin/mailboxes?" + q)
    ]);
    if (userRes.ok) setUsers(userRes.users);
    else setMessage(userRes.error || "Could not load users.");
    if (creatorRes.ok) setCreators(creatorRes.creators);
    else setMessage(creatorRes.error || "Could not load creator accounts.");
    if (mailboxRes.ok) {
      setMailboxes(mailboxRes.mailboxes || []);
      setMailboxDomain(mailboxRes.domain || "talentshowoff.com");
      setMailboxConfigured(true);
    } else {
      setMailboxes([]);
      setMailboxConfigured(mailboxRes.configured !== false);
    }
  }
  useEffect(() => { load(); }, []);

  async function create(e) {
    e.preventDefault(); setBusy(true); setMessage("");
    const res = await api("/admin/users", { method:"POST", body:JSON.stringify({...auth(), username, displayName, email}) });
    setBusy(false);
    if (!res.ok) return setMessage(res.error || "Could not create user.");
    setMessage(`User account created. Generated password: ${res.generatedPassword}${res.emailed ? " — emailed to the user." : " — Resend email was not sent."}`);
    setUsername(""); setDisplayName(""); setEmail(""); load();
  }

  async function resetUser(user) {
    if (!window.confirm(`Reset the password for ${user.username}?`)) return;
    const res = await api("/admin/users/reset-password", { method:"POST", body:JSON.stringify({...auth(), username:user.username}) });
    if (res.ok) {
      setMessage(`New password for ${user.username}: ${res.generatedPassword}${res.emailed ? " — emailed to the user." : ""}`);
      onPasswordNotice(res.generatedPassword);
    } else setMessage(res.error || "Could not reset password.");
  }

  async function removeUser(user) {
    if (!window.confirm(`Remove registered account "${user.username}"? This permanently removes the account and its TSO coin history.`)) return;
    const res = await api("/admin/users", { method:"DELETE", body:JSON.stringify({...auth(), username:user.username}) });
    if (res.ok) { setMessage(`Registered account ${user.username} was removed.`); load(); }
    else setMessage(res.error || "Could not remove user account.");
  }

  async function createCreator(e) {
    e.preventDefault(); setCreatorBusy(true); setMessage("");
    const res = await api("/admin/creators", {
      method:"POST",
      body:JSON.stringify({...auth(), username:creatorUsername, displayName:creatorName, email:creatorEmail})
    });
    setCreatorBusy(false);
    if (!res.ok) return setMessage(res.error || "Could not create creator account.");
    setMessage(`Second creator account created. Temporary password: ${res.generatedPassword}${res.emailed ? " — emailed with Resend." : " — Resend email was not sent."}`);
    setCreatorUsername(""); setCreatorName(""); setCreatorEmail("");
    load();
  }

  async function resetCreator(creator) {
    if (!window.confirm(`Change the password for creator ${creator.username}?`)) return;
    const res = await api("/admin/creators/reset-password", {
      method:"POST", body:JSON.stringify({...auth(), username:creator.username})
    });
    if (res.ok) {
      setMessage(`New password for creator ${creator.username}: ${res.generatedPassword}${res.emailed ? " — emailed with Resend." : ""}`);
      onPasswordNotice(res.generatedPassword);
    } else setMessage(res.error || "Could not change creator password.");
  }

  async function removeCreator(creator) {
    if (!window.confirm(`Remove the second creator account "${creator.username}"? They will no longer be able to sign in.`)) return;
    const res = await api("/admin/creators", {
      method:"DELETE", body:JSON.stringify({...auth(), username:creator.username})
    });
    if (res.ok) {
      setMessage(`Creator account ${creator.username} was removed.`);
      load();
    } else setMessage(res.error || "Could not remove creator account.");
  }

  return (
    <div className="max-w-5xl mx-auto px-5 py-10 space-y-8">
      <div>
        <h1 className="text-2xl font-extrabold text-slate-900">Creator management</h1>
        <p className="text-sm text-slate-500 mt-1">Only the main creator can add, remove, or change the password of a second creator account.</p>
      </div>

      <div className="bg-white rounded-2xl border border-emerald-200 p-6 shadow-sm">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
          <div>
            <h2 className="font-bold text-slate-900 mb-1">Talentshowoff mail names</h2>
            <p className="text-xs text-slate-500">See how many mailbox names have been created and which <b>@{mailboxDomain}</b> addresses are in use.</p>
          </div>
          <div className="rounded-2xl bg-emerald-50 px-5 py-3 text-center min-w-[110px]">
            <div className="text-3xl font-extrabold text-emerald-700">{mailboxes.length}</div>
            <div className="text-[11px] font-bold uppercase tracking-wide text-emerald-600">Mailboxes</div>
          </div>
        </div>
        {!mailboxConfigured ? (
          <p className="text-sm text-slate-500">Mail service is not configured on this deployment.</p>
        ) : mailboxes.length === 0 ? (
          <p className="text-sm text-slate-500">No Talentshowoff mailboxes have been created yet.</p>
        ) : (
          <div className="border border-slate-200 rounded-xl overflow-hidden">
            <div className="px-4 py-3 bg-slate-50 font-bold text-slate-900">Created mail names ({mailboxes.length})</div>
            <div className="divide-y divide-slate-100 max-h-80 overflow-y-auto">
              {mailboxes.map(m => (
                <div key={m.address || m.local_part} className="px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <div className="font-bold text-slate-900">{m.address || `${m.local_part}@${mailboxDomain}`}</div>
                    <div className="text-xs text-slate-500">User: {m.owner_username || "—"}{m.display_name ? ` · ${m.display_name}` : ""}</div>
                  </div>
                  <div className="text-xs text-slate-400">{m.created_at ? fmtDate(m.created_at) : ""}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl border border-violet-200 p-6 shadow-sm">
        <h2 className="font-bold text-slate-900 mb-1">Second creator accounts</h2>
        <p className="text-xs text-slate-500 mb-5">These accounts can manage creator features such as job posts. They cannot remove the main creator or view/reply to job applications.</p>
        <div className="grid lg:grid-cols-[360px,1fr] gap-6">
          <form onSubmit={createCreator} className="space-y-4">
            <TextField label="Display name" required value={creatorName} onChange={e=>setCreatorName(e.target.value)} />
            <TextField label="Username" required value={creatorUsername} onChange={e=>setCreatorUsername(e.target.value)} autoCapitalize="none" />
            <TextField label="Email (optional)" type="email" value={creatorEmail} onChange={e=>setCreatorEmail(e.target.value)} />
            <Button className="w-full" disabled={creatorBusy}>{creatorBusy ? "Creating…" : "Add second creator"}</Button>
          </form>

          <div className="border border-slate-200 rounded-xl overflow-hidden">
            <div className="px-4 py-3 bg-slate-50 font-bold text-slate-900">Current second creators ({creators.length})</div>
            {creators.length === 0 ? (
              <p className="p-5 text-sm text-slate-500">No second creator accounts yet.</p>
            ) : (
              <div className="divide-y divide-slate-100">
                {creators.map(c => (
                  <div key={c.username} className="p-4 flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
                    <div>
                      <div className="font-bold text-slate-900">{c.displayName} <span className="text-slate-400 font-normal">@{c.username}</span></div>
                      <div className="text-xs text-slate-500">{c.email || "No email"} · {c.role}</div>
                    </div>
                    <div className="flex gap-3 text-sm font-bold">
                      <button onClick={()=>resetCreator(c)} className="text-violet-600">Change password</button>
                      <button onClick={()=>removeCreator(c)} className="text-red-600">Remove</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>

      <div className="grid lg:grid-cols-[360px,1fr] gap-6">
        <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
          <h2 className="font-bold text-slate-900 mb-4">Create user account</h2>
          <form onSubmit={create} className="space-y-4">
            <TextField label="Display name" required value={displayName} onChange={e=>setDisplayName(e.target.value)} />
            <TextField label="Username" required value={username} onChange={e=>setUsername(e.target.value)} />
            <TextField label="Email" type="email" required value={email} onChange={e=>setEmail(e.target.value)} />
            <Button className="w-full" disabled={busy}>{busy ? "Creating…" : "Create & generate password"}</Button>
          </form>
          {message && <p className="mt-4 text-sm font-semibold text-violet-700 bg-violet-50 rounded-xl p-3 break-words">{message}</p>}
        </div>
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between"><h2 className="font-bold text-slate-900">Registered users ({users.length})</h2><button onClick={load} className="text-sm font-bold text-violet-600">Refresh</button></div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm"><thead className="bg-slate-50 text-slate-500"><tr><th className="text-left px-5 py-3">Username</th><th className="text-left px-5 py-3">Display name</th><th className="text-left px-5 py-3">Join date</th><th className="text-right px-5 py-3">Action</th></tr></thead>
            <tbody>{users.map(u=><tr key={u.username} className="border-t border-slate-100"><td className="px-5 py-3 font-semibold">{u.username}</td><td className="px-5 py-3">{u.displayName}</td><td className="px-5 py-3 text-slate-500">{u.createdAt ? new Date(u.createdAt).toLocaleString() : "—"}</td><td className="px-5 py-3 text-right"><button onClick={()=>resetUser(u)} className="text-violet-600 font-bold">Reset password</button></td></tr>)}</tbody></table>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- TSO — floating chat assistant, available site-wide ---------- */
function TSOChat({ isAdmin, adminUsername, adminPassword, openSignal }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState(() => [
    { role: "tso", text: "Hi, I'm TSO! Ask me about job listings, how to apply, or how to sign up." }
  ]);
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const scrollRef = useRef(null);

  useEffect(() => {
    if (openSignal) setOpen(true);
  }, [openSignal]);

  useEffect(() => {
    if (open && scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open, sending]);

  useEffect(() => {
    setMessages((prev) => {
      if (prev.length > 1) return prev; // don't reset an in-progress conversation
      return [{
        role: "tso",
        text: isAdmin
          ? "Hi, I'm TSO! I can help draft a post, give you a read on an applicant, or answer questions about your recent activity."
          : "Hi, I'm TSO! Ask me about job listings, how to apply, or how to sign up.",
      }];
    });
  }, [isAdmin]);

  async function send() {
    const text = input.trim();
    if (!text || sending) return;
    const history = messages.slice(-8).map((m) => ({ role: m.role, text: m.text }));
    setMessages((prev) => [...prev, { role: "user", text }]);
    setInput(""); setSending(true); setError("");
    const res = await api("/ai/chat", {
      method: "POST",
      body: JSON.stringify({ message: text, history, adminUsername: isAdmin ? adminUsername : undefined, adminPassword: isAdmin ? adminPassword : undefined }),
    });
    setSending(false);
    if (res.ok) setMessages((prev) => [...prev, { role: "tso", text: res.reply }]);
    else setError(res.error || "TSO couldn't respond just now.");
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return (
    <React.Fragment>
      <button onClick={() => setOpen((o) => !o)}
        className="fixed bottom-5 right-5 z-40 rounded-full shadow-xl text-white flex items-center gap-2 px-4 py-3 font-bold text-sm"
        style={{ background: "linear-gradient(135deg, #1e1b6e 0%, #7c3aed 100%)" }}>
        <Sparkles size={18} />{open ? "Close" : "Chat with TSO"}
      </button>
      {open && (
        <div className="fixed bottom-20 right-5 z-40 w-[92vw] max-w-sm h-[70vh] max-h-[560px] bg-white rounded-2xl border border-slate-200 shadow-2xl flex flex-col overflow-hidden">
          <div className="px-4 py-3 text-white flex items-center gap-2" style={{ background: "linear-gradient(135deg, #1e1b6e 0%, #7c3aed 100%)" }}>
            <Sparkles size={16} />
            <div>
              <p className="font-extrabold text-sm leading-tight">TSO</p>
              <p className="text-xs text-white/80 leading-tight">{isAdmin ? "Creator assistant" : "Talentshowoff assistant"}</p>
            </div>
          </div>
          <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-3 space-y-3">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                <div className={`rounded-2xl px-3 py-2 text-sm max-w-[85%] whitespace-pre-line ${m.role === "user" ? "text-white" : "bg-slate-100 text-slate-700"}`}
                  style={m.role === "user" ? { background: "linear-gradient(135deg, #1e1b6e 0%, #7c3aed 100%)" } : {}}>
                  {m.text}
                </div>
              </div>
            ))}
            {sending && <div className="flex justify-start"><div className="rounded-2xl px-3 py-2 text-sm bg-slate-100 text-slate-400">TSO is typing…</div></div>}
            {error && <p className="text-xs text-red-600 font-semibold">{error}</p>}
          </div>
          <div className="border-t border-slate-100 p-3 flex items-end gap-2">
            <textarea value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKeyDown} rows={1}
              placeholder="Message TSO…" className="flex-1 resize-none rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-violet-400 max-h-24" />
            <Button type="button" onClick={send} disabled={sending || !input.trim()}>Send</Button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}
