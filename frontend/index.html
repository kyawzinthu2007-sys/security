<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Talentshowoff — Job Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  ::selection { background: #c4b5fd; color: #1e1b4b; }
  @keyframes floatIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .animate-floatIn { animation: floatIn 0.35s ease both; }
  @media print { body { display:none !important; } }
  img { -webkit-user-drag: none; user-select: none; }
  .tso-capture-blocked::after { content: "Screenshots and screen capture are not permitted on Talentshowoff"; position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(8, 11, 35, .94); color: white; text-align: center; font-weight: 800; font-size: 18px; pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // The frontend is served by the same Flask server, so relative paths work.
  window.__TSO_API__ = "/api";
  window.__TSO_LOGO__ = "logo.jpg";
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const API = window.__TSO_API__;
let passwordForUnifiedCreatorLogin = "";
const LOGO_SRC = window.__TSO_LOGO__;

/* ---------- tiny API client ---------- */
async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
  });
  let data;
  try { data = await res.json(); } catch (e) { data = { ok: false, error: "Server error." }; }
  if (!res.ok && data.ok === undefined) data.ok = false;
  return data;
}

/* ---------- local session (who is currently signed in on this browser) ---------- */
const session = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },
  remove(key) { try { localStorage.removeItem(key); } catch (e) {} }
};

function TSOMark({ size = 40, rounded = true }) {
  return (
    <img src={LOGO_SRC} alt="Talentshowoff logo" width={size} height={size}
      style={{ width: size, height: size, objectFit: "contain", borderRadius: rounded ? 10 : 0 }}
      onError={(e) => { e.target.style.display = "none"; }} />
  );
}

const fmtDate = (iso) => {
  const d = new Date(iso);
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return `${days}d ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
};

const CATEGORIES = [
  "Music & Performing Arts", "Dance", "Visual Arts & Design", "Film & Video",
  "Writing & Content", "Modeling", "Comedy & Hosting", "Photography",
  "Production & Crew", "Education & Teaching", "Sales & Retail", "Other Creative Work",
];
const JOB_TYPES = ["Full-time", "Part-time", "Freelance / Gig", "Contract", "Internship"];
const TERMS_VERSION = "2026-08-13";
const PRIVACY_VERSION = "2026-08-13";
const PHONE_COUNTRIES = [
  ["MM", "Myanmar (+95)"], ["TH", "Thailand (+66)"], ["SG", "Singapore (+65)"],
  ["MY", "Malaysia (+60)"], ["IN", "India (+91)"], ["BD", "Bangladesh (+880)"],
  ["CN", "China (+86)"], ["JP", "Japan (+81)"], ["KR", "South Korea (+82)"],
  ["PH", "Philippines (+63)"], ["ID", "Indonesia (+62)"], ["VN", "Vietnam (+84)"],
  ["GB", "United Kingdom (+44)"], ["US", "United States (+1)"], ["CA", "Canada (+1)"],
  ["AU", "Australia (+61)"], ["NZ", "New Zealand (+64)"], ["AE", "United Arab Emirates (+971)"],
  ["SA", "Saudi Arabia (+966)"], ["DE", "Germany (+49)"], ["FR", "France (+33)"],
  ["IT", "Italy (+39)"], ["ES", "Spain (+34)"], ["NL", "Netherlands (+31)"],
  ["BR", "Brazil (+55)"], ["ZA", "South Africa (+27)"], ["NG", "Nigeria (+234)"]
];


/* ---------- icons ---------- */
function Star({ className = "", size = 14 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" className={className} fill="currentColor"><path d="M12 1l2.9 7.3L22 11l-7.1 2.7L12 21l-2.9-7.3L2 11l7.1-2.7z" /></svg>;
}
function Sparkles({ className = "", size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1" />
      <circle cx="12" cy="12" r="2.2" />
    </svg>
  );
}
function Icon({ path, size = 16, className = "" }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d={path} /></svg>;
}
const ICONS = {
  image: "M3 3h18v18H3zM8.5 8.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 15l-5-5L5 21",
  type: "M4 7V4h16v3M9 20h6M12 4v16",
  upload: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",
  trash: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z",
  edit: "M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z",
  mail: "M4 4h16v16H4V4zm0 0 8 8 8-8",
  star: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
  reply: "M9 14 4 9l5-5M4 9h11a4 4 0 0 1 4 4v7",
};
function GoogleIcon({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.1 5.5 29.3 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.1 5.5 29.3 3.5 24 3.5c-7.5 0-14 4.2-17.7 10.2z"/>
      <path fill="#4CAF50" d="M24 44.5c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.6 2.4-7.2 2.4-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.9 40.3 16.4 44.5 24 44.5z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C41 35 44.5 30 44.5 24c0-1.2-.1-2.4-.4-3.5z"/>
    </svg>
  );
}

/* ---------- UI atoms ---------- */
function Badge({ children, tone = "violet" }) {
  const tones = {
    violet: "bg-violet-50 text-violet-700 ring-violet-200",
    navy: "bg-indigo-50 text-indigo-700 ring-indigo-200",
    green: "bg-emerald-50 text-emerald-700 ring-emerald-200",
    slate: "bg-slate-100 text-slate-600 ring-slate-200",
    amber: "bg-amber-50 text-amber-700 ring-amber-200",
  };
  return <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wide ring-1 ${tones[tone]}`}>{children}</span>;
}
function TextField({ label, hint, ...props }) {
  return (
    <label className="block">
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</span>
      <input {...props} className="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-[15px] text-slate-900 placeholder-slate-400 outline-none transition focus:bg-white focus:border-violet-500 focus:ring-4 focus:ring-violet-100" />
      {hint && <span className="block text-xs text-slate-400 mt-1">{hint}</span>}
    </label>
  );
}
function TextArea({ label, ...props }) {
  return (
    <label className="block">
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</span>
      <textarea {...props} className="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-[15px] text-slate-900 placeholder-slate-400 outline-none transition focus:bg-white focus:border-violet-500 focus:ring-4 focus:ring-violet-100 resize-none" />
    </label>
  );
}
function Select({ label, children, ...props }) {
  return (
    <label className="block">
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</span>
      <select {...props} className="w-full rounded-xl border border-slate-200 bg-slate-50/60 px-4 py-3 text-[15px] text-slate-900 outline-none transition focus:bg-white focus:border-violet-500 focus:ring-4 focus:ring-violet-100">
        {children}
      </select>
    </label>
  );
}
function Button({ children, variant = "primary", className = "", ...props }) {
  const variants = {
    primary: "text-white shadow-lg shadow-violet-900/25 hover:shadow-xl hover:shadow-violet-900/30 hover:-translate-y-0.5 active:translate-y-0",
    ghost: "text-slate-700 hover:bg-slate-100 active:scale-[0.98]",
    outline: "text-violet-700 border-2 border-violet-200 hover:bg-violet-50 active:scale-[0.98]",
    danger: "text-red-600 border-2 border-red-100 hover:bg-red-50 active:scale-[0.98]",
    google: "text-slate-700 border-2 border-slate-200 hover:bg-slate-50 active:scale-[0.98]",
  };
  const style = variant === "primary" ? { background: "linear-gradient(135deg, #1e1b6e 0%, #5b21b6 55%, #7c3aed 100%)" } : {};
  return (
    <button {...props} style={style} disabled={props.disabled} className={`inline-flex items-center justify-center gap-2 rounded-xl px-5 py-3 text-sm font-bold transition disabled:opacity-50 disabled:pointer-events-none ${variants[variant]} ${className}`}>
      {children}
    </button>
  );
}
function SegButton({ active, onClick, children, icon }) {
  return (
    <button type="button" onClick={onClick}
      className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-bold transition ${active ? "bg-white shadow text-violet-700" : "text-slate-500 hover:text-slate-700"}`}>
      {icon && <Icon path={ICONS[icon]} size={15} />}{children}
    </button>
  );
}

function App() {
  const [jobs, setJobs] = useState([]);
  const [loadingJobs, setLoadingJobs] = useState(true);
  const [applications, setApplications] = useState([]);
  const [userApplications, setUserApplications] = useState([]);
  const [user, setUser] = useState(() => session.get("tso:currentUser", null));
  const [isAdmin, setIsAdmin] = useState(() => session.get("tso:isAdmin", false));
  const [adminUsername, setAdminUsername] = useState(() => session.get("tso:creatorUsername", ""));
  const [adminPassword, setAdminPassword] = useState(() => session.get("tso:creatorPassword", ""));
  const [view, setView] = useState("browse");
  const [authMode, setAuthMode] = useState("signin");
  const [selectedJob, setSelectedJob] = useState(null);
  const [editingJob, setEditingJob] = useState(null);
  const [toast, setToast] = useState(null);
  const [search, setSearch] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("All");
  const [typeFilter, setTypeFilter] = useState("All");
  const [remoteOnly, setRemoteOnly] = useState(false);

  const refreshJobs = useCallback(async () => {
    setLoadingJobs(true);
    const res = await api("/jobs");
    if (res.ok) setJobs(res.jobs);
    setLoadingJobs(false);
  }, []);

  const refreshApplications = useCallback(async (username, password) => {
    if (!username || !password) { setApplications([]); return; }
    const res = await api("/applications?username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password));
    if (res.ok) setApplications(res.applications);
    else setApplications([]);
  }, []);

  const refreshUserApplications = useCallback(async (username, token) => {
    if (!username || !token) { setUserApplications([]); return; }
    const res = await api("/applications?token=" + encodeURIComponent(token));
    if (res.ok) setUserApplications(res.applications);
    else setUserApplications([]);
  }, []);

  useEffect(() => { refreshJobs(); }, [refreshJobs]);
  useEffect(() => {
    if (isAdmin && adminUsername === "tsoofficial") refreshApplications(adminUsername, adminPasswordRef.current);
    else if (!isAdmin) setApplications([]);
  }, [isAdmin, adminUsername, refreshApplications]);
  useEffect(() => { if (user && !isAdmin) refreshUserApplications(user.username, user.token); else setUserApplications([]); }, [user, isAdmin, refreshUserApplications]);
  useEffect(() => { if (user) session.set("tso:currentUser", user); else session.remove("tso:currentUser"); }, [user]);
  useEffect(() => { const handler = (e) => setView(e.detail); window.addEventListener("tso:navigate", handler); return () => window.removeEventListener("tso:navigate", handler); }, []);
  useEffect(() => { session.set("tso:isAdmin", isAdmin); }, [isAdmin]);

  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2800); }, []);

  const filteredJobs = useMemo(() => {
    return jobs.filter((j) => {
      if (categoryFilter !== "All" && j.category && j.category !== categoryFilter) return false;
      if (typeFilter !== "All" && j.type && j.type !== typeFilter) return false;
      if (remoteOnly && !j.remote) return false;
      if (search.trim()) {
        const q = search.toLowerCase();
        const hay = [j.title, j.company, j.description, j.location].filter(Boolean).join(" ").toLowerCase();
        return hay.includes(q);
      }
      return true;
    }).sort((a, b) => new Date(b.postedAt) - new Date(a.postedAt));
  }, [jobs, search, categoryFilter, typeFilter, remoteOnly]);

  async function handlePostJob(job) {
    try {
      const res = await api("/jobs", { method: "POST", body: JSON.stringify({ job, token: user?.token, adminUsername: adminUsername, adminPassword: adminPasswordRef.current }) });
      if (res.ok) {
        if (!isAdmin && user && typeof res.tsoCoins === "number") setUser(prev => prev ? { ...prev, tsoCoins: res.tsoCoins } : prev);
        showToast(res.approvalStatus === "pending"
          ? `Submitted for admin review${res.chargedCoins ? ` · ${res.chargedCoins} TSO coins reserved` : ""}.`
          : (res.chargedCoins ? `Post published. ${res.chargedCoins} TSO coins used.` : "Post published successfully!"));
        setView("browse");
        setSelectedJob(null);
        setEditingJob(null);
        await refreshJobs();
      } else {
        showToast(res.error || "Couldn't publish the post. Please sign in again.");
      }
    } catch (err) {
      console.error(err);
      showToast("Server connection failed. Make sure the Talentshowoff server is running.");
    }
  }
  async function handleJobView(jobId) {
    try {
      const res = await api("/jobs/" + jobId + "/view", {
        method: "POST",
        body: JSON.stringify({ token: user?.token || "" })
      });
      if (res.ok && typeof res.viewCount === "number") {
        setJobs(prev => prev.map(j => j.id === jobId ? { ...j, viewCount: res.viewCount } : j));
        setSelectedJob(prev => prev && prev.id === jobId ? { ...prev, viewCount: res.viewCount } : prev);
      }
    } catch (err) {
      console.warn("Could not record job view", err);
    }
  }
  async function handleUpdateJob(updated) {
    const res = await api("/jobs/" + updated.id, { method: "PUT", body: JSON.stringify({ job: updated, adminUsername: adminUsername, adminPassword: adminPasswordRef.current }) });
    if (res.ok) { showToast("Post updated."); setEditingJob(null); setView("browse"); refreshJobs(); setSelectedJob(null); }
    else showToast(res.error || "Couldn't update.");
  }
  async function handleDeleteJob(jobId) {
    const res = await api("/jobs/" + jobId, { method: "DELETE", body: JSON.stringify({ adminUsername: adminUsername, adminPassword: adminPasswordRef.current }) });
    if (res.ok) { showToast("Post deleted."); setSelectedJob(null); setView("browse"); refreshJobs(); }
    else showToast(res.error || "Couldn't delete.");
  }
  async function handleApply(jobId, applicant) {
    // The application endpoint authenticates users with the server-issued session token.
    // Do not rely on username alone because the server intentionally ignores it for authentication.
    const currentUser = user || session.get("tso:currentUser", null);
    if (!currentUser?.token) {
      showToast("Your sign-in session has expired. Please sign in again.");
      setView("auth");
      return;
    }
    const res = await api("/applications", {
      method: "POST",
      body: JSON.stringify({ jobId, token: currentUser.token, ...applicant })
    });
    if (res.ok) {
      showToast("Application sent!");
      await refreshUserApplications(currentUser.username, currentUser.token);
      setView("dashboard");
    } else if (res.error === "Please sign in before applying for a role.") {
      showToast("Your sign-in session has expired. Please sign in again.");
      setUser(null);
      session.remove("tso:currentUser");
      setView("auth");
    } else {
      showToast(res.error || "Couldn't submit application.");
    }
  }
  function handleAuthed(u) {
    setUser(u);
    if (u.isCreator) {
      adminPasswordRef.current = passwordForUnifiedCreatorLogin;
      setAdminPassword(passwordForUnifiedCreatorLogin);
      setAdminUsername(u.username);
      setIsAdmin(true);
      session.set("tso:creatorUsername", u.username);
      showToast(`Welcome, ${u.displayName}! Creator access enabled.`);
    } else {
      showToast(u.dailyLoginReward ? `Welcome, ${u.displayName}! +${u.dailyLoginReward} TSO coins for today's login.` : `Welcome, ${u.displayName}!`);
    }
    setView("browse");
  }
  function handleLogout() { setUser(null); setUserApplications([]); setApplications([]); handleAdminLogout(false); showToast("Signed out."); setView("browse"); }

  const adminPasswordRef = useRef("");
  function handleAdminLogin(account) {
    adminPasswordRef.current = account.password;
    setAdminPassword(account.password);
    setAdminUsername(account.username);
    setIsAdmin(true);
    session.set("tso:creatorUsername", account.username);
    showToast(`Signed in as ${account.username}.`);
    setView("browse");
  }
  function handleAdminLogout() {
    adminPasswordRef.current = "";
    setAdminUsername("");
    setIsAdmin(false);
    session.remove("tso:creatorUsername"); session.remove("tso:creatorPassword"); setAdminPassword("");
    setApplications([]);
    showToast("Signed out of creator account.");
    setView("browse");
  }

  const [openTSOSignal, setOpenTSOSignal] = useState(0);

  useEffect(() => {
    const block = (e) => {
      const k = (e.key || "").toLowerCase();
      if (k === "printscreen" || (e.ctrlKey && ["s", "p", "u"].includes(k)) || (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(k)) || e.key === "F12") {
        e.preventDefault(); e.stopPropagation();
        document.body.classList.add("tso-capture-blocked");
        window.setTimeout(() => document.body.classList.remove("tso-capture-blocked"), 900);
      }
    };
    const context = (e) => e.preventDefault();
    const copyBlock = (e) => { e.preventDefault(); document.body.classList.add("tso-capture-blocked"); window.setTimeout(() => document.body.classList.remove("tso-capture-blocked"), 1200); };
    const dragBlock = (e) => e.preventDefault();
    const blurOnCapture = () => { if (document.hidden) document.body.classList.add("tso-capture-blocked"); else document.body.classList.remove("tso-capture-blocked"); };
    document.addEventListener("keydown", block, true);
    document.addEventListener("contextmenu", context, true);
    document.addEventListener("copy", copyBlock, true);
    document.addEventListener("cut", copyBlock, true);
    document.addEventListener("dragstart", dragBlock, true);
    document.addEventListener("selectstart", copyBlock, true);
    document.addEventListener("visibilitychange", blurOnCapture, true);
    window.addEventListener("beforeprint", () => document.body.classList.add("tso-capture-blocked"));
    return () => { document.removeEventListener("keydown", block, true); document.removeEventListener("contextmenu", context, true); document.removeEventListener("copy", copyBlock, true); document.removeEventListener("cut", copyBlock, true); document.removeEventListener("dragstart", dragBlock, true); document.removeEventListener("selectstart", copyBlock, true); document.removeEventListener("visibilitychange", blurOnCapture, true); };
  }, []);

  return (
    <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
      <Header user={user} isAdmin={isAdmin} adminUsername={adminUsername} canViewApplications={isAdmin && adminUsername === "tsoofficial"} view={view} setView={setView} onLogout={handleLogout} onAdminLogout={handleAdminLogout} onOpenTSO={() => setOpenTSOSignal((n) => n + 1)} />
      {toast && (
        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 animate-floatIn">
          <div className="flex items-center gap-2 text-white px-4 py-2.5 rounded-full shadow-xl text-sm font-semibold" style={{ background: "linear-gradient(135deg, #1e1b6e 0%, #7c3aed 100%)" }}>
            <Star size={14} />{toast}
          </div>
        </div>
      )}
      <div className="flex-1">
        {view === "browse" && !selectedJob && !editingJob && (
          <Browse jobs={filteredJobs} total={jobs.length} loading={loadingJobs} search={search} setSearch={setSearch}
            categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter}
            typeFilter={typeFilter} setTypeFilter={setTypeFilter}
            remoteOnly={remoteOnly} setRemoteOnly={setRemoteOnly}
            onSelect={(job) => { setSelectedJob(job); handleJobView(job.id); }} isAdmin={isAdmin} canDelete={adminUsername === "tsoofficial"} setView={setView} canBrowseAll={!!user || isAdmin}
            onEdit={(j) => { setEditingJob(j); setView("edit"); }} onDelete={handleDeleteJob} />
        )}
        {selectedJob && !editingJob && (
          <JobDetail job={selectedJob} onBack={() => setSelectedJob(null)} user={user} isAdmin={isAdmin} canDelete={adminUsername === "tsoofficial"}
            onApply={handleApply} hasApplied={userApplications.some((a) => a.jobId === selectedJob.id)}
            setView={setView} onEdit={(j) => setEditingJob(j)} onDelete={handleDeleteJob} />
        )}
        {view === "post" && !selectedJob && !editingJob && <PostJob isAdmin={isAdmin} user={user} onSubmit={handlePostJob} setView={setView} adminUsername={adminUsername} adminPassword={adminPassword} />}
        {view === "tasks" && !isAdmin && user && <Tasks user={user} onUserUpdated={setUser} />}
        {editingJob && <EditJob job={editingJob} onSubmit={handleUpdateJob} onCancel={() => setEditingJob(null)} onDelete={handleDeleteJob} canDelete={adminUsername === "tsoofficial"} adminUsername={adminUsername} adminPassword={adminPassword} />}
        {view === "users" && !selectedJob && !editingJob && isAdmin && adminUsername === "tsoofficial" && <CreatorUserManagement adminUsername={adminUsername} adminPassword={adminPassword} onPasswordNotice={()=>{}} />}
        {view === "creator-coins" && !selectedJob && !editingJob && isAdmin && <CreatorCoinManagement adminUsername={adminUsername} adminPassword={adminPassword} />}
        {view === "moderation" && !selectedJob && !editingJob && isAdmin && <JobModeration adminUsername={adminUsername} adminPassword={adminPassword} onNotify={showToast} onJobsChanged={refreshJobs} />}
        {view === "dashboard" && !selectedJob && !editingJob && (
          isAdmin && adminUsername === "tsoofficial"
            ? <CreatorApplications jobs={jobs} applications={applications} adminUsername={adminUsername} adminPassword={adminPassword} onNotify={showToast}
                onApplicationUpdated={(updated) => setApplications((prev) => prev.map((a) => a.id === updated.id ? updated : a))} />
            : <Dashboard user={user} jobs={jobs} applications={userApplications} onSelectJob={setSelectedJob} />
        )}        {view === "mail" && !selectedJob && !editingJob && user && isAdmin && <Mail user={user} onNotify={showToast} />}
        {view === "profile" && !selectedJob && !editingJob && user && !isAdmin && <Profile user={user} onSaved={(u) => setUser({ ...u, token: user.token })} setView={setView} />}
        {view === "terms" && !selectedJob && !editingJob && <LegalPage type="terms" onBack={() => setView("auth")} />}
        {view === "privacy" && !selectedJob && !editingJob && <LegalPage type="privacy" onBack={() => setView("auth")} />}
        {view === "auth" && !selectedJob && !editingJob && <Auth onAuthed={handleAuthed} setView={setView} setAuthMode={setAuthMode} initialMode={authMode} />}
        {view === "admin" && !selectedJob && !editingJob && <AdminLogin isAdmin={isAdmin} onLogin={handleAdminLogin} onLogout={handleAdminLogout} />}
      </div>
      <TSOChat isAdmin={isAdmin} adminUsername={adminUsername} adminPassword={adminPassword} openSignal={openTSOSignal} />
      <Footer />
    </div>
  );
}

function CVUploadField({ value, name, onChange }) {
  const inputRef = useRef(null);
  function choose(file) {
    if (!file) return;
    const allowed = ["application/pdf", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"];
    if (!allowed.includes(file.type)) { alert("Please upload a PDF, DOC, or DOCX CV."); return; }
    if (file.size > 9 * 1024 * 1024) { alert("Please upload a CV smaller than 9 MB."); return; }
    const reader = new FileReader();
    reader.onload = (e) => onChange({ data: e.target.result, name: file.name });
    reader.readAsDataURL(file);
  }
  return (
    <div>
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">CV / Resume <span className="text-red-500">*</span></span>
      <div onClick={() => inputRef.current?.click()} className="rounded-xl border-2 border-dashed border-slate-300 hover:border-violet-400 hover:bg-violet-50/40 p-5 text-center cursor-pointer transition">
        <Icon path={ICONS.upload} size={26} className="mx-auto text-violet-500 mb-2" />
        <p className="text-sm font-bold text-slate-700">{name || "Click to upload your CV"}</p>
        <p className="text-xs text-slate-400 mt-1">PDF, DOC or DOCX · Maximum 9 MB</p>
      </div>
      <input ref={inputRef} type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" className="hidden" onChange={(e) => choose(e.target.files[0])} />
    </div>
  );
}

/* ---------- Image upload field ---------- */
function ImageUploadField({ value, onChange }) {
  const inputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);

  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onerror = () => alert("Could not read that image. Please choose another file.");
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        // Compress large flyers before sending them as JSON so Publish works
        // reliably even with phone screenshots or high-resolution images.
        const maxSide = 1800;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        onChange(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => alert("That image could not be processed. Please try JPG or PNG.");
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  return (
    <div>
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">Job post image</span>
      {value ? (
        <div className="relative rounded-xl overflow-hidden border border-slate-200">
          <img src={value} alt="Job post preview" className="w-full max-h-96 object-contain bg-slate-50" />
          <button type="button" onClick={() => onChange(null)} className="absolute top-2 right-2 bg-white/95 hover:bg-white text-red-600 rounded-lg px-3 py-1.5 text-xs font-bold shadow">Remove</button>
        </div>
      ) : (
        <div
          onClick={() => inputRef.current && inputRef.current.click()}
          onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
          className={`flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed px-6 py-10 text-center cursor-pointer transition ${dragOver ? "border-violet-500 bg-violet-50" : "border-slate-300 hover:border-violet-400 hover:bg-slate-50"}`}
        >
          <Icon path={ICONS.upload} size={28} className="text-violet-500" />
          <p className="text-sm font-bold text-slate-700">Click to upload or drag & drop</p>
          <p className="text-xs text-slate-400">PNG or JPG — the flyer/announcement image for this job</p>
        </div>
      )}
      <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e.target.files[0])} />
    </div>
  );
}

/* ---------- AI assistant: draft a post from a short brief ---------- */
function AIDraftHelper({ adminUsername, adminPassword, onApply }) {
  const [open, setOpen] = useState(false);
  const [brief, setBrief] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [draft, setDraft] = useState(null);

  async function generate() {
    if (!brief.trim()) return;
    setLoading(true); setError(""); setDraft(null);
    const res = await api("/ai/draft-post", { method: "POST", body: JSON.stringify({ brief, adminUsername, adminPassword }) });
    setLoading(false);
    if (res.ok) setDraft(res.draft);
    else setError(res.error || "Couldn't generate a draft.");
  }

  function useDraft() {
    onApply(draft);
    api("/ai/feedback", { method: "POST", body: JSON.stringify({ kind: "draft-post", note: "Creator accepted the AI draft as-is.", adminUsername, adminPassword }) });
    setOpen(false); setDraft(null); setBrief("");
  }

  return (
    <div className="rounded-2xl border border-violet-200 bg-violet-50/60 p-4 mb-5">
      <button type="button" onClick={() => setOpen(!open)} className="w-full flex items-center justify-between text-left">
        <span className="flex items-center gap-2 font-bold text-violet-800 text-sm"><Sparkles size={16} /> AI Assistant — draft this post for me</span>
        <span className="text-violet-500 text-xs font-semibold">{open ? "Hide" : "Open"}</span>
      </button>
      {open && (
        <div className="mt-4 space-y-3">
          <TextArea label="Describe the role in a few words" rows={3}
            placeholder="e.g. weekend barista, Gulshan cafe, must be friendly, tk 400/hr"
            value={brief} onChange={(e) => setBrief(e.target.value)} />
          <div className="flex items-center gap-3">
            <Button type="button" onClick={generate} disabled={loading || !brief.trim()}>{loading ? "Drafting…" : "Generate draft"}</Button>
            {error && <span className="text-sm text-red-600 font-semibold">{error}</span>}
          </div>
          {draft && (
            <div className="rounded-xl bg-white border border-slate-200 p-4 space-y-2 text-sm">
              <p className="font-extrabold text-slate-900">{draft.title}</p>
              <p className="text-slate-500">{draft.company} · {draft.location} {draft.remote ? "· Remote" : ""}</p>
              <p className="text-slate-500">{draft.category} · {draft.type} {draft.pay ? `· ${draft.pay}` : ""}</p>
              <p className="text-slate-700 whitespace-pre-line">{draft.description}</p>
              <div className="flex gap-2 pt-2">
                <Button type="button" onClick={useDraft}>Use this draft</Button>
                <Button type="button" variant="ghost" onClick={() => setDraft(null)}>Discard</Button>
              </div>
              <p className="text-xs text-slate-400">You can still edit anything below before publishing.</p>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function CreatorApplications({ jobs, applications, adminUsername, adminPassword, onNotify, onApplicationUpdated }) {
  const [selected, setSelected] = useState(null);
  const [replyText, setReplyText] = useState("");
  const [sending, setSending] = useState(false);
  const [replyError, setReplyError] = useState("");
  const [screenings, setScreenings] = useState({});
  const [screeningLoading, setScreeningLoading] = useState(null);
  const [screeningError, setScreeningError] = useState({});

  async function screenApplicant(applicationId) {
    setScreeningLoading(applicationId);
    setScreeningError((prev) => ({ ...prev, [applicationId]: "" }));
    const res = await api("/ai/screen-applicant", { method: "POST", body: JSON.stringify({ applicationId, adminUsername, adminPassword }) });
    setScreeningLoading(null);
    if (res.ok) setScreenings((prev) => ({ ...prev, [applicationId]: res.screening }));
    else setScreeningError((prev) => ({ ...prev, [applicationId]: res.error || "Couldn't screen this applicant." }));
  }

  function sendScreeningFeedback(applicationId, useful) {
    api("/ai/feedback", { method: "POST", body: JSON.stringify({
      kind: "screen-applicant",
      note: useful ? "Creator found this screening useful." : "Creator found this screening not useful / inaccurate.",
      adminUsername, adminPassword,
    }) });
    onNotify(useful ? "Thanks — noted." : "Thanks, the assistant will factor that in.");
  }

  async function sendReply(applicationId) {
    const text = replyText.trim();
    if (!text) return;
    setSending(true); setReplyError("");
    const res = await api(`/applications/${encodeURIComponent(applicationId)}/reply`, { method: "POST", body: JSON.stringify({ username: adminUsername, password: adminPassword, message: text }) });
    setSending(false);
    if (res.ok) {
      setReplyText("");
      onNotify("Message sent to applicant.");
      onApplicationUpdated(res.application);
    }
    else setReplyError(res.error || "Could not send message.");
  }

  return (
    <div className="max-w-5xl mx-auto px-5 py-10">
      <div className="mb-7"><div className="flex items-center gap-2 text-violet-600 text-xs font-bold uppercase tracking-widest mb-2"><Star size={12} /> Creator only</div><h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Job applications</h1><p className="text-slate-500 text-sm mt-1">Review applications and message applicants about their application.</p></div>
      {applications.length === 0 ? <div className="bg-white rounded-2xl border border-dashed border-slate-200 p-10 text-center text-slate-400">No applications yet.</div> :
        <div className="space-y-3">{applications.map((a) => {
          const job = jobs.find((j) => j.id === a.jobId); const open = selected === a.id;
          return <div key={a.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <button className="w-full text-left p-5 flex items-center justify-between gap-4 hover:bg-slate-50" onClick={() => { setSelected(open ? null : a.id); setReplyError(""); }}><div className="min-w-0"><p className="font-extrabold text-slate-900">{a.name}</p><p className="text-sm text-slate-500 truncate">{job?.title || "Job announcement"} · {a.email}</p></div><Badge tone="violet">{a.status || "Submitted"}</Badge></button>
            {open && <div className="border-t border-slate-100 p-5 space-y-5 text-sm">
              <div className="grid sm:grid-cols-2 gap-5"><div className="space-y-2"><p><strong>Name:</strong> {a.name}</p><p><strong>Email:</strong> <a className="text-violet-700 font-semibold" href={`mailto:${a.email}`}>{a.email}</a></p><p><strong>Phone:</strong> {a.phone || "—"}</p><p><strong>Applied:</strong> {new Date(a.appliedAt).toLocaleString()}</p><p><strong>Job:</strong> {job?.title || "Job announcement"}</p></div><div className="space-y-3">{a.cvData && <a href={a.cvData} download={a.cvName || "CV"} className="inline-flex items-center justify-center rounded-xl px-4 py-3 font-bold text-white" style={{ background: "linear-gradient(135deg, #1e1b6e 0%, #7c3aed 100%)" }}>Download CV · {a.cvName || "CV"}</a>}{a.portfolio && <p><strong>Portfolio:</strong> <a className="text-violet-700 break-all" href={a.portfolio} target="_blank" rel="noreferrer">{a.portfolio}</a></p>}{a.message && <p><strong>Applicant message:</strong><br /><span className="text-slate-600 whitespace-pre-line">{a.message}</span></p>}</div></div>

              <div className="rounded-xl border border-violet-200 bg-violet-50/60 p-4">
                <div className="flex items-center justify-between gap-3 mb-1">
                  <p className="font-bold text-violet-800 flex items-center gap-2"><Sparkles size={15} /> AI screening</p>
                  {!screenings[a.id] && <Button type="button" variant="ghost" onClick={() => screenApplicant(a.id)} disabled={screeningLoading === a.id}>{screeningLoading === a.id ? "Reading…" : "Ask AI"}</Button>}
                </div>
                {screeningError[a.id] && <p className="text-sm text-red-600 font-semibold">{screeningError[a.id]}</p>}

                  <div className="space-y-2 text-sm mt-2">

                    {screenings[a.id].strengths?.length > 0 && <div><p className="text-xs font-bold uppercase tracking-wide text-emerald-700">Strengths</p><ul className="list-disc list-inside text-slate-600">{screenings[a.id].strengths.map((s, i) => <li key={i}>{s}</li>)}</ul></div>}
                    {screenings[a.id].gaps_or_questions?.length > 0 && <div><p className="text-xs font-bold uppercase tracking-wide text-amber-700">Gaps / questions</p><ul className="list-disc list-inside text-slate-600">{screenings[a.id].gaps_or_questions.map((s, i) => <li key={i}>{s}</li>)}</ul></div>}

                    <div className="flex items-center gap-3 pt-1">
                      <span className="text-xs text-slate-400">Helpful?</span>
                      <button type="button" onClick={() => sendScreeningFeedback(a.id, true)} className="text-xs font-bold text-emerald-700 hover:underline">Yes</button>
                      <button type="button" onClick={() => sendScreeningFeedback(a.id, false)} className="text-xs font-bold text-red-600 hover:underline">No</button>
                    </div>
                  </div>
                )}
              </div>
              <div className="rounded-xl bg-violet-50 border border-violet-100 p-4"><p className="font-bold text-slate-800 mb-2">Reply to applicant</p><textarea value={replyText} onChange={e => setReplyText(e.target.value)} rows={4} maxLength={5000} placeholder="Write a message about the application…" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 outline-none focus:border-violet-400 resize-y" /><div className="flex items-center justify-between gap-3 mt-3"><span className="text-xs text-slate-400">The applicant will see this in their dashboard.</span><Button onClick={() => sendReply(a.id)} disabled={sending || !replyText.trim()}>{sending ? "Sending…" : "Send message"}</Button></div>{replyError && <p className="text-sm text-red-600 font-semibold mt-2">{replyError}</p>}</div>
            </div>}
          </div>;
        })}</div>}
    </div>
  );
}

/* ---------- Sign in / Sign up (real backend calls) ---------- */
function Auth({ onAuthed, setView, setAuthMode, initialMode = "signin" }) {
  const [mode, setMode] = useState(initialMode);
  useEffect(() => { setMode(initialMode); }, [initialMode]); // signin | signup | forgot-question | forgot-reset | verify-email
  const [username, setUsername] = useState("");
  const [loginEmail, setLoginEmail] = useState("");
  const [password, setPassword] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [phone, setPhone] = useState("");
  const [phoneCountry, setPhoneCountry] = useState("MM");
  const [dateOfBirth, setDateOfBirth] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [googleClientId, setGoogleClientId] = useState("");
  const [email, setEmail] = useState("");
  const [securityQuestion, setSecurityQuestion] = useState("What was the name of your first school?");
  const [securityAnswer, setSecurityAnswer] = useState("");
  const [agreedToTerms, setAgreedToTerms] = useState(false);
  const [recoveryQuestion, setRecoveryQuestion] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [verificationUsername, setVerificationUsername] = useState("");

  async function submitSignin(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    const res = await api("/auth/signin", { method: "POST", body: JSON.stringify({ email: loginEmail, password }) });
    setLoading(false);
    if (res.ok) { passwordForUnifiedCreatorLogin = password; onAuthed({ ...res.user, token: res.token }); }
    else if (res.needsVerification) { setVerificationUsername(res.loginEmail || loginEmail); setMode("verify-email"); setError(res.error || "Please verify your email first."); }
    else setError(res.error || "Sign in failed.");
  }

  async function submitSignup(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    const res = await api("/auth/signup", { method: "POST", body: JSON.stringify({ username, password, displayName: displayName || username, email, phone, phoneCountry, dateOfBirth, securityQuestion, securityAnswer, source: "manual", agreedToTerms, termsVersion: TERMS_VERSION, privacyVersion: PRIVACY_VERSION }) });
    setLoading(false);
    if (res.ok) { setVerificationUsername(res.user.username); setMode("verify-email"); setError(""); }
    else setError(res.error || "Sign up failed.");
  }

  async function startForgot(e) {
    e.preventDefault(); setError(""); setLoading(true);
    const res = await api("/auth/forgot/question", { method: "POST", body: JSON.stringify({ email: loginEmail }) });
    setLoading(false);
    if (res.ok) { setRecoveryQuestion(res.question); setMode("forgot-reset"); }
    else setError(res.error || "Could not find that account.");
  }
  async function finishForgot(e) {
    e.preventDefault(); setError(""); setLoading(true);
    const res = await api("/auth/forgot/reset", { method: "POST", body: JSON.stringify({ email: loginEmail, securityAnswer, newPassword }) });
    setLoading(false);
    if (res.ok) { setMode("signin"); setPassword(""); setNewPassword(""); setSecurityAnswer(""); setError("Password reset successfully. You can sign in now."); }
    else setError(res.error || "Password reset failed.");
  }

  // Fetch the Google OAuth Client ID from the backend (kept out of the
  // frontend source so it can be changed in Render without redeploying).
  useEffect(() => {
    api("/auth/google-config").then((res) => { if (res.ok && res.clientId) setGoogleClientId(res.clientId); });
  }, []);

  // Render the real "Sign in with Google" button once the client ID is
  // known and Google's script has loaded. Handles both sign-in and sign-up
  // in one flow: Google verifies the email for us.
  const googleButtonRef = useRef(null);
  useEffect(() => {
    if (!googleClientId || !(mode === "signin" || mode === "signup")) return;

    const renderGoogleButton = () => {
      if (!window.google || !window.google.accounts || !window.google.accounts.id || !googleButtonRef.current) return false;
      window.google.accounts.id.initialize({
        client_id: googleClientId,
        callback: async (response) => {
          setError(""); setLoading(true);
          const res = await api("/auth/google", { method: "POST", body: JSON.stringify({ credential: response.credential }) });
          setLoading(false);
          if (res.ok) onAuthed({ ...res.user, token: res.token });
          else setError(res.error || "Google sign-in failed.");
        },
      });
      googleButtonRef.current.innerHTML = "";
      window.google.accounts.id.renderButton(googleButtonRef.current, {
        theme: "outline", size: "large", width: 320,
        text: mode === "signup" ? "signup_with" : "signin_with",
      });
      return true;
    };

    if (renderGoogleButton()) return;
    const timer = setInterval(() => {
      if (renderGoogleButton()) clearInterval(timer);
    }, 250);
    return () => clearInterval(timer);
  }, [googleClientId, mode]);

  return (
    <div className="max-w-sm mx-auto px-5 py-14">
      <div className="text-center mb-7">
        <div className="inline-flex"><TSOMark size={40} /></div>
        <h1 className="text-xl font-extrabold text-slate-900 mt-3">
          {mode === "signin" ? "Welcome back" : mode === "signup" ? "Create your account" : mode === "forgot-question" ? "Reset your password" : mode === "forgot-reset" ? "Answer your security question" : mode === "verify-email" ? "Verify your email" : "Set a password"}
        </h1>
        <p className="text-slate-500 text-sm mt-1">
          {mode === "signin" ? "Sign in to apply for roles." : mode === "signup" ? "Sign up to apply for roles." : mode === "forgot-question" || mode === "forgot-reset" ? "Recover your account securely." : mode === "verify-email" ? "Check your inbox to activate your account." : "One more step to finish setting up your account."}
        </p>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        {mode === "signin" && (
          <React.Fragment>
            <form onSubmit={submitSignin} className="space-y-4">
              <TextField label="Talentshowoff email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value.toLowerCase())} placeholder="yourname@talentshowoff.com" type="email" autoCapitalize="none" autoCorrect="off" hint="Use your Talentshowoff email instead of your username." />
              <TextField label="Password" type="password" required value={password} onChange={(e) => setPassword(e.target.value)} />
              {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
              <Button type="submit" className="w-full" disabled={loading}>{loading ? "Checking…" : "Sign in"}</Button>
            </form>
            <button type="button" onClick={() => { setMode("forgot-question"); setError(""); }} className="w-full text-sm font-bold text-violet-600 hover:text-violet-800 mt-3">Forgot password?</button>
            {googleClientId && (
              <React.Fragment>
                <div className="flex items-center gap-3 my-5"><div className="h-px bg-slate-200 flex-1" /><span className="text-xs text-slate-400 font-semibold">OR</span><div className="h-px bg-slate-200 flex-1" /></div>
                <div className="flex justify-center"><div ref={googleButtonRef} /></div>
              </React.Fragment>
            )}
          </React.Fragment>
        )}

        {mode === "forgot-question" && (
          <form onSubmit={startForgot} className="space-y-4">
            <TextField label="Talentshowoff email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value.toLowerCase())} placeholder="yourname@talentshowoff.com" type="email" autoCapitalize="none" autoCorrect="off" hint="Use your Talentshowoff email instead of your username." />
            {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
            <Button type="submit" className="w-full" disabled={loading}>{loading ? "Looking up…" : "Continue"}</Button>
            <Button type="button" variant="ghost" className="w-full" onClick={() => { setMode("signin"); setError(""); }}>Back to sign in</Button>
          </form>
        )}

        {mode === "forgot-reset" && (
          <form onSubmit={finishForgot} className="space-y-4">
            <div className="bg-violet-50 border border-violet-100 rounded-xl p-4 text-sm font-semibold text-violet-900">{recoveryQuestion}</div>
            <TextField label="Security answer" required value={securityAnswer} onChange={(e) => setSecurityAnswer(e.target.value)} autoFocus />
            <TextField label="New password" type="password" required value={newPassword} onChange={(e) => setNewPassword(e.target.value)} hint="At least 6 characters" />
            {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
            <Button type="submit" className="w-full" disabled={loading}>{loading ? "Resetting…" : "Reset password"}</Button>
          </form>
        )}

        {mode === "verify-email" && (
          <div className="space-y-4">
            <div className="bg-violet-50 border border-violet-100 rounded-xl p-4 text-sm text-violet-900 leading-relaxed">
              We sent a secure verification link to your email. Open it to activate your account, then return here to sign in.
            </div>
            <Button type="button" className="w-full" onClick={async () => {
              setError(""); setLoading(true);
              const res = await api("/auth/resend-verification", { method: "POST", body: JSON.stringify({ email: verificationUsername }) });
              setLoading(false);
              setError(res.ok ? "A new verification email has been sent." : (res.error || "Could not resend the email."));
            }} disabled={loading}>{loading ? "Sending…" : "Resend verification email"}</Button>
            <Button type="button" variant="ghost" className="w-full" onClick={() => { setMode("signin"); setError(""); }}>Back to sign in</Button>
            {error && <p className="text-sm font-semibold text-slate-600">{error}</p>}
          </div>
        )}

        {mode === "signup" && (
          <React.Fragment>
            <form onSubmit={submitSignup} className="space-y-4">
              <TextField label="Display name" required value={displayName} onChange={(e) => setDisplayName(e.target.value)} placeholder="Jordan Rivera" />
              <TextField label="Email name (username)" required value={username} onChange={(e) => setUsername(e.target.value)} placeholder="jordan.rivera" hint={`Your sign-in email will be ${username || "jordan.rivera"}@talentshowoff.com. Use Gmail/another email below for verification.`} autoCapitalize="none" autoCorrect="off" />
              <TextField label="Email" type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" />
              <div className="grid grid-cols-[1fr_1.6fr] gap-3">
                <Select label="Country" required value={phoneCountry} onChange={(e) => setPhoneCountry(e.target.value)}>
                  {PHONE_COUNTRIES.map(([code, label]) => <option key={code} value={code}>{label}</option>)}
                </Select>
                <TextField label="Phone number" type="tel" required value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="09 123 456 789" hint="Length and format are checked for the selected country." />
              </div>
              <TextField label="Date of birth" type="date" required value={dateOfBirth} onChange={(e) => setDateOfBirth(e.target.value)} />
              <Select label="Security question" value={securityQuestion} onChange={(e) => setSecurityQuestion(e.target.value)}>
                <option>What was the name of your first school?</option>
                <option>What city were you born in?</option>
                <option>What was your childhood nickname?</option>
                <option>What was the name of your first pet?</option>
              </Select>
              <TextField label="Security answer" required value={securityAnswer} onChange={(e) => setSecurityAnswer(e.target.value)} hint="Used to recover your account if you forget your password." />
              <TextField label="Password" type="password" required value={password} onChange={(e) => setPassword(e.target.value)} hint="At least 6 characters" />
              <AgreementBox checked={agreedToTerms} onChange={setAgreedToTerms} onTerms={() => { setAuthMode("signup"); setView("terms"); }} onPrivacy={() => { setAuthMode("signup"); setView("privacy"); }} />
              {error && <p className="text-sm text-red-600 font-semibold">{error}</p>}
              <Button type="submit" className="w-full" disabled={loading || !agreedToTerms}>{loading ? "Creating…" : "Create account"}</Button>
            </form>
            {googleClientId && (
              <React.Fragment>
                <div className="flex items-center gap-3 my-5"><div className="h-px bg-slate-200 flex-1" /><span className="text-xs text-slate-400 font-semibold">OR</span><div className="h-px bg-slate-200 flex-1" /></div>
                <div className="flex justify-center"><div ref={googleButtonRef} /></div>
              </React.Fragment>
            )}
          </React.Fragment>
        )}
      </div>

      {(mode === "signin" || mode === "signup") && (
        <p className="text-center text-sm text-slate-500 mt-5">
          {mode === "signin" ? "New here?" : "Already have an account?"}{" "}
          <button onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); }} className="font-bold text-violet-600 hover:text-violet-800">
            {mode === "signin" ? "Create an account" : "Sign in"}
          </button>
        </p>
      )}
    </div>
  );
}

function resizeImageFile(file, maxSize = 512, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) return reject(new Error("Not an image"));
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function Mail({ user, onNotify }) {
  const [loading, setLoading] = useState(true);
  const [configured, setConfigured] = useState(true);
  const [hasMailbox, setHasMailbox] = useState(false);
  const [mailbox, setMailbox] = useState(null);
  const [localPart, setLocalPart] = useState("");
  const [settingUp, setSettingUp] = useState(false);
  const [setupError, setSetupError] = useState("");

  const [folders, setFolders] = useState([]);
  const [activeFolder, setActiveFolder] = useState("Inbox");
  const [messages, setMessages] = useState([]);
  const [loadingMessages, setLoadingMessages] = useState(false);
  const [selected, setSelected] = useState(null);
  const [composing, setComposing] = useState(false);

  const checkStatus = useCallback(async () => {
    setLoading(true);
    const res = await api("/mail/status", { headers: { Authorization: `Bearer ${user.token}` } });
    setLoading(false);
    if (!res.ok) return;
    setConfigured(res.configured);
    setHasMailbox(res.hasMailbox);
    if (res.hasMailbox) setMailbox(res.mailbox);
  }, [user.token]);

  useEffect(() => { checkStatus(); }, [checkStatus]);

  const loadFolders = useCallback(async () => {
    const res = await api("/mail/folders", { headers: { Authorization: `Bearer ${user.token}` } });
    if (res.ok) setFolders(res.folders);
  }, [user.token]);

  const loadMessages = useCallback(async (folderName) => {
    setLoadingMessages(true);
    const res = await api("/mail/messages?folder=" + encodeURIComponent(folderName), { headers: { Authorization: `Bearer ${user.token}` } });
    setLoadingMessages(false);
    if (res.ok) setMessages(res.messages);
  }, [user.token]);

  useEffect(() => { if (hasMailbox) { loadFolders(); loadMessages(activeFolder); } }, [hasMailbox, loadFolders]);
  useEffect(() => { if (hasMailbox) loadMessages(activeFolder); }, [activeFolder]);

  async function openMessage(id) {
    const res = await api("/mail/messages/" + id, { headers: { Authorization: `Bearer ${user.token}` } });
    if (res.ok) {
      setSelected(res.message);
      setMessages((prev) => prev.map((m) => m.id === id ? { ...m, isRead: true } : m));
    }
  }

  async function toggleStar(m, e) {
    e.stopPropagation();
    const next = !m.isStarred;
    setMessages((prev) => prev.map((x) => x.id === m.id ? { ...x, isStarred: next } : x));
    await api("/mail/messages/" + m.id + "/star", { method: "POST", headers: { Authorization: `Bearer ${user.token}` }, body: JSON.stringify({ starred: next }) });
  }

  async function moveMessage(id, folderName) {
    const res = await api("/mail/messages/" + id + "/move", { method: "POST", headers: { Authorization: `Bearer ${user.token}` }, body: JSON.stringify({ folder: folderName }) });
    if (res.ok) {
      onNotify(`Moved to ${folderName}.`);
      setSelected(null);
      loadMessages(activeFolder);
      loadFolders();
    }
  }

  async function setupMailbox(e) {
    e.preventDefault();
    setSetupError("");
    setSettingUp(true);
    const res = await api("/mail/setup", { method: "POST", headers: { Authorization: `Bearer ${user.token}` }, body: JSON.stringify({ localPart }) });
    setSettingUp(false);
    if (res.ok) {
      setHasMailbox(true);
      setMailbox(res.mailbox);
      onNotify(`Mailbox created: ${res.mailbox.address}`);
    } else {
      setSetupError(res.error || "Could not create your mailbox.");
    }
  }

  if (loading) {
    return <div className="max-w-3xl mx-auto px-5 py-16 text-center text-slate-400 text-sm">Loading mail…</div>;
  }

  if (!configured) {
    return (
      <div className="max-w-2xl mx-auto px-5 py-16 text-center">
        <div className="w-14 h-14 rounded-2xl bg-violet-100 text-violet-700 flex items-center justify-center mx-auto mb-4"><Icon path={ICONS.mail} size={26} /></div>
        <h1 className="text-xl font-extrabold text-slate-900">Creator Mail isn't set up yet</h1>
        <p className="text-sm text-slate-500 mt-2">The site owner hasn't configured the mail feature on this deployment yet. Check back later.</p>
      </div>
    );
  }

  if (!hasMailbox) {
    return (
      <div className="max-w-lg mx-auto px-5 py-16">
        <div className="text-center mb-6">
          <div className="w-14 h-14 rounded-2xl bg-violet-100 text-violet-700 flex items-center justify-center mx-auto mb-4"><Icon path={ICONS.mail} size={26} /></div>
          <h1 className="text-xl font-extrabold text-slate-900">Create your Talentshowoff mailbox</h1>
          <p className="text-sm text-slate-500 mt-2">Optional — get a @talentshowoff.com address to message creators and applicants directly.</p>
        </div>
        <form onSubmit={setupMailbox} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
          <TextField label="Choose your mailbox name" value={localPart} onChange={(e) => setLocalPart(e.target.value.toLowerCase())}
            placeholder={user.username} hint="Lowercase letters, numbers, dots, underscores, hyphens. This will be yourname@talentshowoff.com." />
          {setupError && <div className="text-sm font-semibold text-red-600">{setupError}</div>}
          <Button type="submit" variant="primary" disabled={settingUp} className="w-full">{settingUp ? "Creating…" : "Create mailbox"}</Button>
        </form>
      </div>
    );
  }

  return (
    <div className="max-w-6xl mx-auto px-5 py-8">
      <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-extrabold text-slate-900">Mail</h1>
          <p className="text-sm text-slate-500 mt-0.5">{mailbox?.address}</p>
        </div>
        <Button variant="primary" onClick={() => { setComposing(true); setSelected(null); }}>+ Compose</Button>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-[180px_1fr] gap-5">
        <div className="flex md:flex-col gap-1.5 overflow-x-auto md:overflow-visible pb-2 md:pb-0">
          {folders.map((f) => (
            <button key={f.id} onClick={() => { setActiveFolder(f.name); setSelected(null); setComposing(false); }}
              className={`flex items-center justify-between gap-2 shrink-0 px-3 py-2 rounded-lg text-sm font-bold text-left transition ${activeFolder === f.name ? "bg-violet-50 text-violet-700" : "text-slate-600 hover:bg-slate-100"}`}>
              <span>{f.name}</span>
              {f.unread > 0 && <Badge tone="violet">{f.unread}</Badge>}
            </button>
          ))}
        </div>

        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm min-h-[420px]">
          {composing ? (
            <ComposeMail user={user} mailbox={mailbox} onSent={() => { setComposing(false); setActiveFolder("Sent"); loadFolders(); }} onCancel={() => setComposing(false)} />
          ) : selected ? (
            <MessageView message={selected} onBack={() => setSelected(null)} onMove={moveMessage} onReply={() => setComposing(true)} activeFolder={activeFolder} />
          ) : (
            <div className="divide-y divide-slate-100">
              {loadingMessages ? (
                <div className="text-center text-slate-400 text-sm py-16">Loading…</div>
              ) : messages.length === 0 ? (
                <div className="text-center text-slate-400 text-sm py-16">No messages in {activeFolder}.</div>
              ) : messages.map((m) => (
                <div key={m.id} className={`w-full px-5 py-4 flex items-start gap-3 hover:bg-slate-50 transition ${!m.isRead ? "bg-violet-50/40" : ""}`}>
                  <button type="button" onClick={(e) => toggleStar(m, e)} className={`mt-0.5 shrink-0 ${m.isStarred ? "text-amber-400" : "text-slate-300 hover:text-slate-400"}`}>
                    <Icon path={ICONS.star} size={16} />
                  </button>
                  <button type="button" onClick={() => openMessage(m.id)} className="min-w-0 flex-1 text-left">
                    <div className="flex items-center justify-between gap-3">
                      <span className={`text-sm truncate ${!m.isRead ? "font-extrabold text-slate-900" : "font-semibold text-slate-700"}`}>{m.fromName || m.fromAddress}</span>
                      <span className="text-xs text-slate-400 shrink-0">{new Date(m.sentAt || m.createdAt).toLocaleDateString()}</span>
                    </div>
                    <div className={`text-sm truncate ${!m.isRead ? "font-bold text-slate-800" : "text-slate-600"}`}>{m.subject}</div>
                    <div className="text-xs text-slate-400 truncate mt-0.5">{m.preview}</div>
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function MessageView({ message, onBack, onMove, onReply, activeFolder }) {
  return (
    <div className="p-6">
      <button onClick={onBack} className="text-sm font-bold text-slate-500 hover:text-slate-700 mb-4">&larr; Back</button>
      <h2 className="text-lg font-extrabold text-slate-900">{message.subject}</h2>
      <div className="text-sm text-slate-500 mt-1">From {message.fromName ? `${message.fromName} <${message.fromAddress}>` : message.fromAddress}</div>
      <div className="text-xs text-slate-400 mt-0.5">To {message.toAddresses.join(", ")} · {new Date(message.sentAt || message.createdAt).toLocaleString()}</div>
      <div className="flex items-center gap-2 mt-4 mb-5">
        <Button variant="outline" className="!px-3.5 !py-2 text-[13px]" onClick={onReply}><Icon path={ICONS.reply} size={14} />Reply</Button>
        {activeFolder !== "Trash" && <Button variant="outline" className="!px-3.5 !py-2 text-[13px]" onClick={() => onMove(message.id, "Trash")}><Icon path={ICONS.trash} size={14} />Delete</Button>}
